<!doctype html><html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Message Center — Vulnerable Lab</title><link rel="stylesheet" href="../styles.css">
</head><body><main class="app">
  <a class="back" href="../index.html">← All labs</a><section class="panel">
    <h1>Cross-window message center</h1>
    <p class="hint"><strong>Deliberate unsafe messaging:</strong> messages from every origin are accepted and rendered as HTML.</p>
    <a class="button" href="message-sender.html" target="_blank">Open demonstration sender</a>
    <div id="messages" class="output">Waiting for a message…</div>
  </section>
</main><script>
  window.addEventListener('message', (event) => {
    // VULNERABILITY: event.origin is never checked and data is treated as HTML.
    document.querySelector('#messages').innerHTML = event.data;
  });
</script></body></html>
